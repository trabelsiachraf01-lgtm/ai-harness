[project]
name = "ai-harness"
version = "0.1.0"
description = "A small, readable, general-purpose agent harness."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "prompt-toolkit>=3.0",
    "pydantic>=2.7",
    "rich>=13",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
